},

title:"Indian Tricolour Portrait",
text:"Photorealistic cinematic portrait using the reference face as an exact identity reference, preserve facial features, face shape, skin tone, hairstyle and beard, naturally wrapped in the Indian tricolour flag, realistic fabric folds, dramatic warm lighting, realistic skin texture, no face distortion, 8K, 9:16."

}

const categories = [
"All",
"God / Devotional",
"Realistic Portrait",
"Cinematic",
"Ghibli / Anime",
"Gaming",
"Instagram Viral",
"Indian / Patriotic",
"Couple / Love",
"Nature / Landscape",
"Luxury / Lifestyle",
"Fashion",
"Fantasy / Mythology"
];


let activeCategory = "All";


const categoryBox =
document.getElementById("categories");

const grid =
document.getElementById("grid");

const search =
document.getElementById("search");


categories.forEach(category => {

const button =
document.createElement("button");

button.className = "category";

button.innerText = category;

if(category === "All"){
button.classList.add("active");
}

button.onclick = () => {

activeCategory = category;

document
.querySelectorAll(".category")
.forEach(b => b.classList.remove("active"));

button.classList.add("active");

showPrompts();

};

categoryBox.appendChild(button);

});


function showPrompts(){

const keyword =
search.value.toLowerCase();

const filtered =
prompts.filter(prompt => {

const categoryMatch =
activeCategory === "All" ||
prompt.category === activeCategory;

const searchMatch =
(prompt.title + " " + prompt.text + " " + prompt.category)
.toLowerCase()
.includes(keyword);

return categoryMatch && searchMatch;

});


grid.innerHTML = "";


if(filtered.length === 0){

grid.innerHTML =
'<div class="noresult">😔 No prompts found</div>';

return;

}


filtered.forEach(prompt => {

const card =
document.createElement("div");

card.className = "card";

card.innerHTML = `

<div class="tag">
${prompt.category}
</div>

<h3>
${prompt.title}
</h3>

<p>
${prompt.text}
</p>

<button class="copy">
📋 Copy Prompt
</button>

`;

card
.querySelector(".copy")
.onclick = function(){

navigator.clipboard.writeText(prompt.text);

this.innerText = "Copied ✓";

setTimeout(() => {

this.innerText = "📋 Copy Prompt";

},1500);

};

grid.appendChild(card);

});

}


search.addEventListener("input", showPrompts);


showPrompts();

</script>
